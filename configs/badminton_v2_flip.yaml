# badminton_v2 with the horizontal flip on, to measure what the flip is worth
# where the labels have almost no horizontal offset
# (docs/2026-11-18-badminton-results.md §5).
# Result: level with badminton_v2 epoch for epoch, and no offset (§6 there).
# Every key not set here comes from badminton_v2.yaml and default.yaml.

base: badminton_v2.yaml

horizontal_flip: true

# The first five of badminton_v2's ten epochs. The learning-rate drops stay
# after epochs 6 and 8, so every epoch here runs at the learning rate
# badminton_v2's first five ran at, and the two per-epoch curves can be
# compared directly.
# To finish the run as badminton_v2 was, resume with epochs: 10 under this
# experiment_name.
epochs: 5

experiment_name: badminton_v2_flip
