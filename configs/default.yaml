# TrackNet V2 Training Configuration

# Model
in_channels: 9
seq_len: 3
input_size: [512, 288]
heatmap_radius: 2.5

# Optimizer
optimizer: AdamW
learning_rate: 1.0e-4

# LR Schedule
lr_schedule:
  name: MultiStepLR
  milestones: [20, 25]
  gamma: 0.1

# Training
batch_size: 2
epochs: 30
seed: 42
train_stride: 1         # validation and test always use stride 3
log_every: 100          # steps between running-loss log lines

# DataLoader
num_workers: 4
pin_memory: true
persistent_workers: true

# Mixed Precision
amp_dtype: bfloat16

# torch.compile
compile_model: true

# Checkpointing
checkpoint_dir: checkpoints
experiment_name: tennis_v2_baseline

# TensorBoard
log_dir: runs

# Detection
detection_threshold: 0.5
distance_threshold: 4

# Dataset: root/<game>/<clip>/Label.csv; splits are made by game
data:
  format: tennis
  root: datasets/tennis
  val_groups: [game7]
  test_groups: [game8, game9, game10]
