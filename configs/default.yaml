# TrackNet V2 Training Configuration

# Model input and target
input_size: [512, 288]
background_frame: false  # append each clip's median background as a fourth image
heatmap_radius: 2.5

# Optimizer: AdamW (decoupled weight decay) or Adam (weight_decay is an L2 penalty)
optimizer: AdamW
learning_rate: 1.0e-4
weight_decay: 0.01

# LR schedule: multiply the learning rate by gamma at each milestone epoch
lr_schedule:
  milestones: [20, 25]
  gamma: 0.1

# Training
batch_size: 2
epochs: 30
seed: 42
train_stride: 1         # validation and test always use stride 3
horizontal_flip: false  # mirror half the training windows; off since it put the tennis baseline 1.1 px off (docs/2026-11-16-training-results.md §4)
color_jitter:           # one draw per training window, applied to every frame in it
  brightness: 0.3
  contrast: 0.3
  saturation: 0.3
  p: 1.0                # share of windows that are jittered
mixup_alpha: 0.0        # Beta(alpha, alpha) sample mixup on each training batch; 0 turns it off (TrackNetV3 uses 0.5)
log_every: 100          # steps between running-loss log lines

# DataLoader
num_workers: 4
pin_memory: true
persistent_workers: true

# Mixed Precision
amp_dtype: bfloat16

# torch.compile
compile_model: false    # needs a C compiler; its speed-up is unmeasured on this machine

# Checkpointing
checkpoint_dir: checkpoints
experiment_name: tennis_v2

# TensorBoard
log_dir: runs

# Detection
detection_threshold: 0.5
distance_threshold: 4

# Dataset: root/<game>/<clip>/Label.csv; splits are made by game
data:
  format: tennis
  root: datasets/tennis
  val_groups: [game7]
  test_groups: [game8, game9, game10]
